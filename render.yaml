# Render Blueprint for the API: dashboard.render.com → New → Blueprint → select this repository.
# You will be asked for the values marked `sync: false`.
services:
  - type: web
    name: krishi-doctor-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@krishi-doctor.app
      - key: ADMIN_PASSWORD
        sync: false
      - key: EURI_API_KEY
        sync: false
      - key: EURI_MODEL
        value: gemini-2.5-flash-lite
      - key: CORS_ORIGINS
        value: '["https://krishi-doctor.netlify.app"]'
